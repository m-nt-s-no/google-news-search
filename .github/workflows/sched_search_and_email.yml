name: Schedule Google News Search and Email
on:
  schedule:
    - cron: '57 14 * * *'  #Every day at 14:57 UTC (avoid peak time at top of hour)

  workflow_dispatch: #Enables manual workflow runs

jobs:
  search_and_email:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.12.10"

      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: Set environment variables from GitHub Secrets
        env:
            GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
            GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
            EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
            EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
            EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
            echo "Environment variables set from GitHub Secrets"
            echo "GOOGLE_API_KEY=$GOOGLE_API_KEY" > .env
            echo "GOOGLE_CSE_ID=$GOOGLE_CSE_ID" >> .env
            echo "EMAIL_SENDER=$EMAIL_SENDER" >> .env
            echo "EMAIL_PASSWORD=$EMAIL_PASSWORD" >> .env
            echo "EMAIL_RECIPIENT=$EMAIL_RECIPIENT" >> .env

      - name: Run search and email
        run: |
            python -m src.news_search

